<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Admin - El Umbral</title>
    <link rel="stylesheet" href="styles/global.css">
    <link rel="stylesheet" href="components/notifications/notifications.css">
    <link rel="stylesheet" href="sections/admin/dashboard/dashboard.css">
</head>
<body>
    <!-- Navbar Admin -->
    <nav class="admin-navbar">
        <div class="admin-navbar-container">
            <div class="admin-navbar-brand">
                <h1>EL UMBRAL</h1>
                <span class="admin-badge">Admin</span>
            </div>
            <div class="admin-navbar-actions">
                <button class="btn-tab" onclick="verListaEspera()">📋 Lista de Espera</button>
                <button class="btn-tab" onclick="verResenas()">⭐ Reseñas</button>
                <button class="btn-tab" onclick="verEncuestas()">📊 Encuestas</button>
                <span class="admin-user">👤 admin</span>
                <button class="btn-logout" onclick="logout()">Cerrar Sesión</button>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="admin-container">
        <!-- Header -->
        <div class="admin-header">
            <h2 class="admin-title">Gestión de Reservas</h2>
            <div class="admin-stats" id="admin-stats">
                <div class="stat-card">
                    <span class="stat-label">Total Reservas</span>
                    <span class="stat-value" id="stat-total">0</span>
                </div>
                <div class="stat-card">
                    <span class="stat-label">Pre-confirmadas</span>
                    <span class="stat-value" id="stat-preconfirmadas">0</span>
                </div>
                <div class="stat-card">
                    <span class="stat-label">Confirmadas</span>
                    <span class="stat-value" id="stat-confirmadas">0</span>
                </div>
                <div class="stat-card">
                    <span class="stat-label">Finalizadas</span>
                    <span class="stat-value" id="stat-finalizadas">0</span>
                </div>
            </div>
        </div>

        <!-- Filtros -->
        <div class="admin-filters">
            <input 
                type="text" 
                id="search-input" 
                class="search-input" 
                placeholder="🔍 Buscar por nombre o teléfono..."
            >
            <select id="filter-estado" class="filter-select">
                <option value="">Todos los estados</option>
                <option value="PRE_CONFIRMADA">Pre-confirmada</option>
                <option value="CONFIRMADA">Confirmada</option>
                <option value="PAGADA_COMPLETA">Pagada Completa</option>
                <option value="EN_CURSO">En Curso</option>
                <option value="FINALIZADA">Finalizada</option>
                <option value="CANCELADA_CLIENTE">Cancelada por Cliente</option>
                <option value="CANCELADA_ADMIN">Cancelada por Admin</option>
            </select>
            <button class="btn-refresh" onclick="cargarReservas()">↻ Actualizar</button>
        </div>

        <!-- Tabla de Reservas -->
        <div class="reservas-table-container">
            <div class="loading" id="loading" style="display: none;">
                <p>Cargando reservas...</p>
            </div>
            
            <div class="no-data" id="no-data" style="display: none;">
                <p>No hay reservas registradas</p>
            </div>
            
            <table class="reservas-table" id="reservas-table" style="display: none;">
                <thead>
                    <tr>
                        <th data-column="id">ID</th>
                        <th data-column="nombreCliente">Cliente</th>
                        <th>Teléfono</th>
                        <th data-column="nombreExperiencia">Experiencia</th>
                        <th data-column="fechaEvento">Fecha Evento</th>
                        <th data-column="horaInicio">Hora Evento</th>
                        <th data-column="horarioContacto">Horario Contacto</th>
                        <th data-column="precioTotal">Total</th>
                        <th data-column="estado">Estado</th>
                        <th data-column="estadoPago">Pago</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody id="reservas-tbody">
                    <!-- Filas dinámicas -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modal de Detalles -->
    <div class="modal" id="modal-detalle" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Detalles de la Reserva</h3>
                <button class="modal-close" onclick="cerrarModal()">✕</button>
            </div>
            <div class="modal-body" id="modal-body">
                <!-- Contenido dinámico -->
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" onclick="cerrarModal()">Cerrar</button>
            </div>
        </div>
    </div>

    <script src="components/notifications/notifications.js"></script>
    <script src="scripts/api.js"></script>
    <script src="scripts/auth.js"></script>
    <script src="sections/admin/dashboard/dashboard.js"></script>
</body>
</html>
