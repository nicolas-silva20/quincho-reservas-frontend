<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Administrador - El Umbral</title>
    <link rel="stylesheet" href="styles/global.css">
    <link rel="stylesheet" href="sections/admin/login/login.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <h1 class="login-title">EL UMBRAL</h1>
                <p class="login-subtitle">Panel de Administración</p>
            </div>
            
            <form class="login-form" id="login-form">
                <div class="form-group">
                    <label for="username">Usuario</label>
                    <input 
                        type="text" 
                        id="username" 
                        class="form-control" 
                        placeholder="admin"
                        autocomplete="username"
                        required
                    >
                </div>
                
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input 
                        type="password" 
                        id="password" 
                        class="form-control" 
                        placeholder="••••••••"
                        autocomplete="current-password"
                        required
                    >
                </div>
                
                <div class="error-message" id="error-message" style="display: none;"></div>
                
                <button type="submit" class="btn-login" id="btn-login">
                    <span class="btn-text">Iniciar Sesión</span>
                    <span class="btn-loading" style="display: none;">Cargando...</span>
                </button>
            </form>
            
            <div class="login-footer">
                <a href="index.html" class="back-link">← Volver al sitio principal</a>
            </div>
        </div>
    </div>
    
    <script src="scripts/api.js"></script>
    <script src="scripts/auth.js"></script>
    <script src="sections/admin/login/login.js"></script>
</body>
</html>
